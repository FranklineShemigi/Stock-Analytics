<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Company | NSE Market Analytics</title>


    <!-- ===== CSS ===== -->

    <link
        rel="stylesheet"
        href="css/variables.css"
    >

    <link
        rel="stylesheet"
        href="css/base.css"
    >

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >

</head>


<body>


    <main class="dashboard">


        <!-- ===== Back Navigation ===== -->

        <a
            href="javascript:history.back()"
            class="back-link"
        >

            ← Back

        </a>


        <!-- ===== Company Header ===== -->

        <header class="dashboard-header">

            <div>

                <span
                    class="company-ticker"
                    id="companyTicker"
                >
                    --
                </span>


                <h1 id="companyName">

                    Loading company...

                </h1>


                <p id="companySector">

                    Loading sector...

                </p>

            </div>

        </header>


        <!-- ===== Company Overview ===== -->

        <section class="overview-grid">


            <article class="overview-card">

                <span class="overview-card-label">

                    Current Price

                </span>


                <strong
                    class="overview-card-value"
                    id="currentPrice"
                >

                    --

                </strong>

            </article>


            <article class="overview-card">

                <span class="overview-card-label">

                    Performance

                </span>


                <strong
                    class="overview-card-value"
                    id="performance"
                >

                    --

                </strong>

            </article>


            <article class="overview-card">

                <span class="overview-card-label">

                    Period

                </span>


                <strong
                    class="overview-card-value"
                    id="currentPeriod"
                >

                    1M

                </strong>

            </article>


            <article class="overview-card">

                <span class="overview-card-label">

                    Rank

                </span>


                <strong
                    class="overview-card-value"
                    id="companyRank"
                >

                    --

                </strong>

            </article>


        </section>


        <!-- ===== Performance ===== -->

        <section class="performance-section">


            <h2>

                Price Performance

            </h2>


            <!-- ===== Period Controls ===== -->

            <div
                class="performance-controls"
                id="periodControls"
            >

                <button
                    class="period-button"
                    data-period="1D"
                >
                    1D
                </button>


                <button
                    class="period-button"
                    data-period="1W"
                >
                    1W
                </button>


                <button
                    class="period-button active"
                    data-period="1M"
                >
                    1M
                </button>


                <button
                    class="period-button"
                    data-period="3M"
                >
                    3M
                </button>


                <button
                    class="period-button"
                    data-period="6M"
                >
                    6M
                </button>


                <button
                    class="period-button"
                    data-period="1Y"
                >
                    1Y
                </button>


                <button
                    class="period-button"
                    data-period="5Y"
                >
                    5Y
                </button>

                <button
                    class="period-button"
                    data-period="YTD"
                >
                    YTD
                </button>

                <button
                    class="period-button"
                    data-period="ALL"
                >
                    All
                </button>

                <button
                    class="custom-range-toggle"
                    id="customRangeToggle"
                    type="button"
                >
                    Custom Range
                </button>

            </div>


            <!-- ===== Custom Year Range ===== -->

            <div
                class="custom-range-panel"
                id="customRangePanel"
                hidden
            >

                <label for="fromYearSelect">
                    From
                </label>

                <select id="fromYearSelect"></select>

                <label for="toYearSelect">
                    To
                </label>

                <select id="toYearSelect"></select>

                <button
                    class="apply-range-button"
                    id="applyRangeButton"
                    type="button"
                >
                    Apply
                </button>

            </div>

           <!-- ===== Price chart ===== -->
            <div class="company-chart">
                <canvas
                    id="priceChart"
                    aria-label= "Historical price chart"
               > </canvas>
            </div>


            <!-- ===== Price Information ===== -->

            <div class="ranking-card">

                <div class="table-wrapper">

                    <table class="ranking-table">


                        <thead>

                            <tr>

                                <th>
                                    Metric
                                </th>

                                <th>
                                    Value
                                </th>

                            </tr>

                        </thead>


                        <tbody id="companyDetails">

                            <tr>

                                <td colspan="2">

                                    Loading company data...

                                </td>

                            </tr>

                        </tbody>


                    </table>

                </div>

            </div>


        </section>


    </main>


    <!-- ===== JavaScript ===== -->

    <script src="js/data-loader.js"></script>

    <script src="js/year-range.js"></script>

    <script src="js/performance.js"></script>

    <script src="js/company.js"></script>


</body>

</html>
