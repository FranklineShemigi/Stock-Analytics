<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sector | NSE Market Analytics</title>


    <!-- ===== CSS ===== -->

    <link
        rel="stylesheet"
        href="css/variables.css"
    >

    <link
        rel="stylesheet"
        href="css/base.css"
    >

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >



    <!-- ===== PWA ===== -->

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#0F766E">

    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <link rel="icon" href="icons/icon-192.png" type="image/png">

</head>


<body>


    <main class="dashboard">


        <!-- ===== Back Navigation ===== -->

        <a
            href="index.html"
            class="back-link"
        >

            ← Back to Market

        </a>


        <!-- ===== Sector Header ===== -->

        <header class="dashboard-header">

            <div>

                <h1 id="sectorName">
                    Loading sector...
                </h1>

                <p id="sectorDescription">
                    Loading sector information...
                </p>

            </div>

        </header>


        <!-- ===== Sector Overview ===== -->

        <section class="overview-grid">


            <article class="overview-card">

                <span class="overview-card-label">
                    Companies
                </span>

                <strong
                    class="overview-card-value"
                    id="companyCount"
                >
                    --
                </strong>

            </article>


            <article class="overview-card">

                <span class="overview-card-label">
                    Top Performer
                </span>

                <strong
                    class="overview-card-value"
                    id="topGainer"
                >
                    --
                </strong>

            </article>


            <article class="overview-card">

                <span class="overview-card-label">
                    Lowest Performer
                </span>

                <strong
                    class="overview-card-value"
                    id="topLoser"
                >
                    --
                </strong>

            </article>


            <article class="overview-card">

                <span class="overview-card-label">
                    Period
                </span>

                <strong
                    class="overview-card-value"
                    id="currentPeriod"
                >
                    1M
                </strong>

            </article>


        </section>


        <!-- ===== Performance ===== -->

        <section class="performance-section">


            <h2>
                Sector Performance
            </h2>
            
            <!-- ===== Market Controls ===== -->

<div class="market-controls">

    <!-- Search -->

    <div class="search-control">

        <label for="companySearch">
            Search company
        </label>

        <input
            type="search"
            id="companySearch"
            placeholder="Search company or ticker..."
            autocomplete="off"
        >

    </div>


    <!-- Sort -->

    <div class="sort-control">

        <label for="sortSelect">
            Sort by
        </label>

        <select id="sortSelect">

            <option value="performance-desc">
                Performance: High → Low
            </option>

            <option value="performance-asc">
                Performance: Low → High
            </option>

            <option value="name-asc">
                Company: A → Z
            </option>

            <option value="name-desc">
                Company: Z → A
            </option>

            <option value="price-desc">
                Price: High → Low
            </option>

            <option value="price-asc">
                Price: Low → High
            </option>

        </select>

    </div>

    <!-- Watchlist Filter -->

    <div class="sort-control">

        <label class="watchlist-filter">

            <input
                type="checkbox"
                id="watchlistOnlyToggle"
            >

            Watchlist only

        </label>

    </div>

    <!-- CSV Export -->

    <div class="sort-control">

        <button
            type="button"
            id="exportCsvButton"
            class="export-csv-button"
        >
            Export CSV
        </button>

    </div>

</div>


            <!-- ===== Period Controls ===== -->

            <div
                class="performance-controls"
                id="periodControls"
            >

                <button
                    class="period-button"
                    data-period="1D"
                >
                    1D
                </button>


                <button
                    class="period-button"
                    data-period="1W"
                >
                    1W
                </button>


                <button
                    class="period-button active"
                    data-period="1M"
                >
                    1M
                </button>


                <button
                    class="period-button"
                    data-period="3M"
                >
                    3M
                </button>


                <button
                    class="period-button"
                    data-period="6M"
                >
                    6M
                </button>


                <button
                    class="period-button"
                    data-period="1Y"
                >
                    1Y
                </button>


                <button
                    class="period-button"
                    data-period="5Y"
                >
                    5Y
                </button>

                <button
                    class="period-button"
                    data-period="YTD"
                >
                    YTD
                </button>

                <button
                    class="period-button"
                    data-period="ALL"
                >
                    All
                </button>

                <button
                    class="custom-range-toggle"
                    id="customRangeToggle"
                    type="button"
                >
                    Custom Range
                </button>

            </div>


            <!-- ===== Custom Year Range ===== -->

            <div
                class="custom-range-panel"
                id="customRangePanel"
                hidden
            >

                <label for="fromYearSelect">
                    From
                </label>

                <select id="fromYearSelect"></select>

                <label for="toYearSelect">
                    To
                </label>

                <select id="toYearSelect"></select>

                <button
                    class="apply-range-button"
                    id="applyRangeButton"
                    type="button"
                >
                    Apply
                </button>

            </div>


            <!-- ===== Ranking Table ===== -->

            <div class="ranking-card">

                <div class="table-wrapper">

                    <table class="ranking-table">


                        <thead>

                            <tr>

                                <th class="watch-column">
                                    <span class="sr-only">Watch</span>
                                </th>

                                <th>
                                    Rank
                                </th>

                                <th>
                                    Company
                                </th>

                                <th>
                                    Ticker
                                </th>

                                <th>
                                    Price
                                </th>

                                <th>
                                    Start Price
                                </th>

                                <th>
                                    Performance
                                </th>

                            </tr>

                        </thead>


                        <tbody id="rankingTable">

                            <tr>

                                <td colspan="7">

                                    Loading sector data...

                                </td>

                            </tr>

                        </tbody>


                    </table>

                </div>

            </div>


        </section>


    </main>


    <!-- ===== JavaScript ===== -->

    <script src="js/register-sw.js"></script>

    <script src="js/data-loader.js"></script>

    <script src="js/year-range.js"></script>

    <script src="js/watchlist.js"></script>

    <script src="js/csv-export.js"></script>

    <script src="js/performance.js"></script>

    <script src="js/sector.js"></script>


</body>

</html>
